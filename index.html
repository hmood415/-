*/
const SUPABASE_URL  = "SUPABASE_URL_HERE";
const SUPABASE_ANON = "SUPABASE_ANON_KEY_HERE";
const db = (SUPABASE_URL.includes("HERE"))
  ? null
  : supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

async function saveClient(name, phone) {
  if (!db) return;
  await db.from("clients").upsert({ name, phone }, { onConflict: "phone" });
}

async function saveBooking(bk) {
  if (!db) return;
  await db.from("bookings").insert({
    client_phone:  bk.userInfo.phone,
    client_name:   bk.userInfo.name,
    service_title: bk.svc.title,
    provider_name: bk.p.name,
    provider_spec: bk.p.spec,
    booking_date:  `${bk.day} ${MONTHS[5]} 2026`,
    booking_time:  bk.time,
    duration_label:bk.dur.label,
    duration_id:   bk.dur.id,
    cost:          bk.cost,
    status:        "upcoming"
  });
}

/* ── SHARED ── */

function Avatar({ p, size=60 }) {
  return (
    <div style={{
      width:size,height:size,borderRadius:16,
      background:"var(--ink)",
      display:"flex",alignItems:"center",justifyContent:"center",
      color:"white",fontWeight:600,fontSize:size*.3,flexShrink:0,
      letterSpacing:"-.5px"
    }}>
      {p.av.in}
    </div>
  );
}

function StarsRow({ rating }) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:2}}>
      {[1,2,3,4,5].map(i=>(
        <span key={i}>{Ico.star(i<=Math.floor(rating))}</span>
      ))}
      <span style={{fontSize:11,color:"var(--txts)",marginRight:4,fontWeight:700}}>{rating}</span>
    </div>
  );
}

function PageHdr({ grad, onBack, children }) {
  return (
    <div style={{
      background:"var(--ink)",
      padding:"26px 18px 16px",color:"white"
    }}>
      {onBack && <button className="backbtn" onClick={onBack}>{Ico.back()} رجوع</button>}
      <div style={{width:24,height:2.5,background:"var(--acc)",borderRadius:2,marginBottom:10}}/>
      {children}
    </div>
  );
}

/* ── TARGET PILLS ── */
function TargetPills({ targets, acc, bg }) {
  return (
    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}}>
      {targets.map(t => (
        <span key={t} className="tpill" style={{background:"transparent",color:"rgba(255,255,255,.72)",border:"1px solid rgba(255,255,255,.28)"}}>
          {t}
        </span>
      ))}
    </div>
  );
}

          <div style={{

          <h1 style={{fontSize:18.5,fontWeight:700,letterSpacing:"-.2px"}}>{svc.title}</h1>
        </div>
        <p style={{fontSize:12,opacity:.82,lineHeight:1.65,maxWidth:300,marginBottom:9}}>

          background:"var(--pbg)",borderRadius:16,padding:"10px 16px",
          display:"inline-flex",alignItems:"center",gap:8,marginBottom:18,

function UserInfoPage({ prov, svc, onNext, onBack }) {
  const [name,  setName]  = useState("");

  const next = () => {
    if(!name.trim())        { setErr("يرجى إدخال اسمك الكامل"); return; }
    const cleanPhone = phone.replace(/\s/g,"");
    if(!/^05\d{8}$/.test(cleanPhone)) {
      setErr("رقم الجوال يجب أن يبدأ بـ 05 ومكون من 10 أرقام"); return;
    }
    setErr("");
    onNext({ name: name.trim(), phone: cleanPhone });
  };

  return (
    <div className="page">
      <PageHdr grad={svc?.grad} onBack={onBack}>
        <h1 style={{fontSize:19,fontWeight:700,marginBottom:3,letterSpacing:"-.2px"}}>بياناتك الشخصية</h1>
        <p style={{fontSize:13,opacity:.88,lineHeight:1.75}}>
          ندخل بياناتك مرة واحدة فقط لتتمكن من إتمام الحجز

      </PageHdr>

      <div style={{padding:"26px 18px"}}>
        {/* Provider reminder */}
        <div style={{
          background:"white",borderRadius:16,padding:16,
          display:"flex",gap:16,alignItems:"center",
          marginBottom:26,
          boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
          border:"1px solid var(--line)"
        }}>
          <Avatar p={prov} size={52}/>
          <div>
            <p style={{fontSize:13.5,fontWeight:600,color:"var(--txt)"}}>{prov.name}</p>
            <p style={{fontSize:11.5,color:"var(--txts)"}}>{prov.spec}</p>
          </div>
          <div style={{
            marginRight:"auto",background:"var(--pbg)",
            borderRadius:16,padding:"6px 14px",
            fontSize:11.5,fontWeight:700,color:"var(--p)",
            border:"1px solid var(--line)"
          }}>
            {svc?.title}
          </div>
        </div>

        {/* Form */}
        <div style={{display:"flex",flexDirection:"column",gap:20}}>
          <div>
            <label style={{
              display:"block",fontSize:13.5,fontWeight:700,

            <input
              className="inp"

              value={name}
              onChange={e=>{ setName(e.target.value); setErr(""); }}
            />
          </div>

          <div>
            <label style={{
              display:"block",fontSize:13.5,fontWeight:700,
              color:"var(--txt)",marginBottom:9
            }}>

              <input
                className="inp"

              />
              <div style={{
                position:"absolute",right:15,top:"50%",
                transform:"translateY(-50%)"
              }}>
                {Ico.phone()}

/* ── BOOKING PAGE ── */

function BookingPage({ p, svc, onConfirm, onBack }) {
  const [day,  setDay]  = useState(null);
  const [time, setTime] = useState(null);
  const [dur,  setDur]  = useState(null);

  const _now = new Date();
  const TODAY=_now.getDate(), YR=_now.getFullYear(), MO=_now.getMonth();
  const dim = new Date(YR,MO+1,0).getDate();
  const fd  = new Date(YR,MO,1).getDay();
  const DAYS = ["أح","إث","ثل","أر","خم","جم","سب"];
  const grid = [];
  for(let i=0;i<fd;i++) grid.push(null);
  for(let d=1;d<=dim;d++) grid.push(d);

  const cost  = dur ? dur.price : null;
  const ready = day && time && dur;
  const step  = !day ? 1 : !time ? 2 : !dur ? 3 : 4;

  return (
    <div className="page">
      <PageHdr grad={svc?.grad} onBack={onBack}>
        <h1 style={{fontSize:19,fontWeight:700,marginBottom:3,letterSpacing:"-.2px"}}>اختر موعدك</h1>
        <p style={{fontSize:12,opacity:.82,marginBottom:12}}>مع {p.name}</p>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          {["التاريخ","الوقت","المدة"].map((lbl,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{
                width:22,height:22,borderRadius:"50%",
                background:step>i+1?"rgba(255,255,255,.92)":step===i+1?"rgba(255,255,255,.32)":"rgba(255,255,255,.14)",
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:9,fontWeight:600,
                color:step>i+1?"var(--p)":"white"
              }}>
                {step>i+1?"✓":i+1}
              </div>
              <span style={{fontSize:10.5,fontWeight:700,opacity:step>=i+1?1:.5}}>{lbl}</span>
              {i<2&&<div style={{width:14,height:1,background:"rgba(255,255,255,.28)"}}/>}
            </div>
          ))}
        </div>
      </PageHdr>

      <div style={{padding:"20px 16px"}}>
        {/* Calendar */}
        <div className="asi" style={{
          background:"white",borderRadius:16,padding:22,
          marginBottom:18,
          boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
          border:"1px solid var(--line)"
        }}>
          <h3 style={{fontSize:14.5,fontWeight:600,color:"var(--txt)",
            textAlign:"center",marginBottom:18}}>
            {MONTHS[MO]} {YR}
          </h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:8}}>
            {DAYS.map(d=>(
              <div key={d} style={{textAlign:"center",fontSize:10.5,
                color:"var(--txts)",fontWeight:700,padding:"4px 0"}}>{d}</div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
            {grid.map((d,i)=>{
              if(!d) return <div key={`e${i}`}/>;
              const past=d<TODAY, sel=day===d, td=d===TODAY;
              const dow=new Date(YR,MO,d).getDay();
              const unavail=past||(p.availDays&&!p.availDays.includes(dow));
              return (
                <div key={d} onClick={()=>{if(!unavail){setDay(d);setTime(null);setDur(null);}}}
                  style={{
                    textAlign:"center",padding:"10px 0",borderRadius:16,fontSize:12.5,
                    fontWeight:sel?800:500,cursor:unavail?"default":"pointer",
                    background:sel?"var(--p)":td&&!unavail?"var(--pbg)":"transparent",
                    color:sel?"white":unavail?"#E7E9E6":td?"var(--p)":"var(--txt)",
                    border:td&&!sel&&!unavail?"2px solid var(--p)":"2px solid transparent",
                    transition:"all .15s",opacity:unavail?.4:1
                  }}>{d}</div>
              );
            })}
          </div>
        </div>

        {/* Time */}
        {day && (
          <div className="au" style={{marginBottom:18}}>
            <h3 style={{fontSize:14.5,fontWeight:600,color:"var(--txt)",marginBottom:14,
              display:"flex",alignItems:"center",gap:9}}>
              {Ico.clock("var(--p)")} اختر الوقت
            </h3>
            {(p.availTimes
              ? [{lbl:"المواعيد المتاحة", slots:p.availTimes}]
              : TIMES
            ).map(per=>(
              <div key={per.lbl} style={{marginBottom:14}}>
                <p style={{fontSize:11.5,fontWeight:700,color:"var(--txts)",marginBottom:9}}>
                  {per.lbl}
                </p>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {per.slots.map(sl=>{
                    const sel=time===sl;
                    return (
                      <button key={sl} onClick={()=>{setTime(sl);setDur(null);}}
                        className="btn" style={{
                          padding:"10px 17px",borderRadius:16,
                          border:`2px solid ${sel?"var(--p)":"var(--brd)"}`,
                          background:sel?"var(--p)":"white",
                          color:sel?"white":"var(--txt)",
                          fontSize:12.5,fontWeight:700,
                          boxShadow:sel?"0 6px 16px var(--line)":"none"
                        }}>{sl}</button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Duration */}
        {day && time && (
          <div className="au" style={{marginBottom:24}}>
            <h3 style={{fontSize:14.5,fontWeight:600,color:"var(--txt)",marginBottom:7,
              display:"flex",alignItems:"center",gap:9}}>
              {Ico.clock("var(--p)")} اختر مدة الجلسة
            </h3>
            <p style={{fontSize:11.5,color:"var(--txts)",marginBottom:16}}>
              السعر يحتسب تلقائياً بناءً على المدة
            </p>
            <div style={{display:"flex",gap:12}}>
              {DURATIONS.map(d=>{
                const sel=dur?.id===d.id;
                const c=d.price;
                return (
                  <div key={d.id} className={`dur-card${sel?" on":""}`}
                    onClick={()=>setDur(d)}>
                    {sel&&(
                      <div style={{
                        position:"absolute",top:8,left:8,
                        width:18,height:18,borderRadius:"50%",
                        background:"var(--p)",display:"flex",
                        alignItems:"center",justifyContent:"center"
                      }}>
                        <span style={{color:"white",fontSize:8,fontWeight:600}}>✓</span>
                      </div>
                    )}
                    {!d.surcharge&&(
                      <div style={{
                        position:"absolute",top:8,right:8,
                        background:"#C08000",
                        borderRadius:16,padding:"3px 7px",
                        fontSize:8,fontWeight:600,color:"white",
                        boxShadow:"0 2px 8px rgba(240,165,0,.35)",
                        display:"flex",alignItems:"center",gap:3
                      }}>{Ico.bestDeal()} الأوفر</div>
                    )}
                    <div style={{marginBottom:8}}>{Ico[d.icon](sel?"var(--p)":"var(--txts)", 28)}</div>
                    <div style={{fontSize:11,fontWeight:600,color:"var(--txt)",marginBottom:7}}>
                      {d.label}
                    </div>
                    <div style={{fontSize:16,fontWeight:700,color:sel?"var(--p)":"var(--txt)"}}>
                      {c} <span style={{fontSize:10,fontWeight:700}}>ر.س</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {ready&&(
          <div className="au" style={{
            background:"var(--pbg)",borderRadius:16,padding:"14px 18px",
            marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center",
            border:"1px solid var(--line)"
          }}>
            <div style={{fontSize:12,color:"var(--txts)",display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
              {Ico.calSm()} {day} {MONTHS[MO]}
              <span style={{opacity:.4}}>·</span>
              {Ico.timeSm()} {time}
              <span style={{opacity:.4}}>·</span>
              {dur.label}
            </div>
            <div style={{fontSize:15,fontWeight:700,color:"var(--p)"}}>{cost} ر.س</div>
          </div>
        )}

        <button className="btn" onClick={()=>ready&&onConfirm(day,time,dur,cost)}
          disabled={!ready} style={{
            background:ready?svc?.grad||"#23302C":"var(--brd)",
            color:ready?"white":"var(--txts)",
            borderRadius:16,padding:19,fontSize:15.5,fontWeight:600,width:"100%",
            boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)"
          }}>
          {!day?"اختر يوماً أولاً":!time?"اختر الوقت":!dur?"اختر مدة الجلسة":"متابعة →"}
        </button>
      </div>
    </div>
  );
}

  const [tab,    setTab]    = useState("upcoming");
  const [dbAppts,setDbAppts]= useState(null); // null = لم يتم التحميل بعد
  const [loading,setLoading]= useState(false);

  useEffect(() => {
    if (!db || !userInfo?.phone) return;
    setLoading(true);
    db.from("bookings")
      .select("*")
      .eq("client_phone", userInfo.phone)
      .order("created_at", { ascending: false })
      .then(({ data, error }) => {
        if (!error && data) setDbAppts(data);
        setLoading(false);
      });
  }, [userInfo?.phone]);

  // إذا وُجد اتصال بقاعدة البيانات استخدمها، وإلا استخدم البيانات التجريبية
  const allAppts = dbAppts !== null ? dbAppts.map(a => ({
    id:     a.id,
    svc:    a.service_title,
    icon:   a.service_title.includes("انطاق") ? "speech"
          : a.service_title.includes("طعام")  ? "food"
          : a.service_title.includes("تواصل") ? "social" : "skills",
    prov:   a.provider_name,
    date:   a.booking_date,
    time:   a.booking_time,
    dur:    a.duration_label,
    status: a.status === "completed" ? "completed" : "upcoming",
    cost:   a.cost,
    fromDB: true
  })) : APPTS;

  const up   = allAppts.filter(a=>a.status==="upcoming");
  const done = allAppts.filter(a=>a.status==="completed");
  const list = tab==="upcoming" ? up : done;

  const fmt = ds => {
    if (!ds) return "";
    if (ds.includes("-")) { const[y,m,d]=ds.split("-"); return `${d} ${MONTHS[+m-1]} ${y}`; }
    return ds; // already formatted string from DB
  };

  return (
    <div className="page">
      <div style={{
        background:"#23302C",
        padding:"26px 18px 16px",color:"white"
      }}>
        <div style={{
          width:34,height:34,borderRadius:10,
          background:"rgba(255,255,255,.18)",
          display:"flex",alignItems:"center",justifyContent:"center",
          marginBottom:9,border:"1px solid rgba(255,255,255,.36)"
        }}>
          {Ico.cal("white",true)}
        </div>
        <h1 style={{fontSize:19,fontWeight:700,marginBottom:3,letterSpacing:"-.2px"}}>مواعيدي</h1>
        <p style={{fontSize:12,opacity:.82}}>جلساتك المجدولة والمنتهية</p>
      </div>

      <div style={{display:"flex",padding:"16px",gap:10,
        background:"white",borderBottom:"1px solid #F3F5F3"}}>
        {[
          {k:"upcoming", lbl:"القادمة", cnt:up.length},
          {k:"completed",lbl:"المنتهية",cnt:done.length}
        ].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} className="btn" style={{
            flex:1,padding:"12px 4px",borderRadius:16,border:"none",
            background:tab===t.k?"var(--p)":"#F3F5F3",
            color:tab===t.k?"white":"var(--txts)",
            fontSize:13.5,fontWeight:700,
            
            display:"flex",alignItems:"center",justifyContent:"center",gap:8
          }}>
            {t.lbl}
            <span style={{
              background:tab===t.k?"rgba(255,255,255,.24)":"var(--pbg)",
              color:tab===t.k?"white":"var(--p)",
              borderRadius:16,padding:"2px 8px",fontSize:11,fontWeight:600
            }}>{t.cnt}</span>
          </button>
        ))}
      </div>

      <div style={{padding:"16px"}}>
        {loading ? (
          <div style={{textAlign:"center",padding:"50px 20px"}}>
            <div style={{
              width:48,height:48,borderRadius:"50%",
              border:"4px solid var(--pbg)",borderTopColor:"var(--p)",
              margin:"0 auto 16px",animation:"spin .8s linear infinite"
            }}/>
            <p style={{color:"var(--txts)",fontSize:13.5}}>جارٍ تحميل مواعيدك...</p>
          </div>
        ) : list.length===0 ? (
          <div style={{textAlign:"center",padding:"56px 20px"}}>
            <div style={{width:76,height:76,borderRadius:16,background:"var(--pbg)",
              margin:"0 auto 18px",display:"flex",alignItems:"center",
              justifyContent:"center",
              boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)"
            }}>{Ico.emptyState()}</div>
            <p style={{color:"var(--txts)",fontSize:14.5,fontWeight:600}}>
              لا توجد حجوزات أو مواعيد
            </p>
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {list.map((a,i)=>(
              <div key={a.id} className="au" style={{
                background:"white",borderRadius:16,padding:18,
                boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
                borderRight:`4px solid ${a.status==="upcoming"?"var(--p)":"var(--brd)"}`,
                animationDelay:`${i*.07}s`,
                border:`1px solid var(--line)`,
                borderRight:`4px solid ${a.status==="upcoming"?"var(--p)":"var(--brd)"}`
              }}>
                <div style={{display:"flex",justifyContent:"space-between",
                  alignItems:"flex-start",marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{
                      width:42,height:42,borderRadius:16,
                      background:"var(--sand)",
                      border:`1.5px solid ${a.status==="upcoming"?"var(--pbg)":"#F3F5F3"}`,
                      boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
                      display:"flex",alignItems:"center",justifyContent:"center"
                    }}>{Ico[a.icon]?.("var(--p)", 20)}</div>
                    <div>
                      <h3 style={{fontSize:14.5,fontWeight:600,color:"var(--txt)",letterSpacing:"-.1px"}}>{a.svc}</h3>
                      <p style={{fontSize:11.5,color:"var(--txts)",display:"flex",alignItems:"center",gap:3}}>{Ico.providerSm()} {a.prov}</p>
                    </div>
                  </div>
                  <span style={{
                    fontSize:10.5,padding:"5px 12px",borderRadius:16,fontWeight:600,
                    background:a.status==="upcoming"?"var(--pbg)":"#F3F5F3",
                    color:a.status==="upcoming"?"var(--p)":"var(--txts)"
                  }}>
                    {a.status==="upcoming"?"قادم":"منتهي"}
                  </span>
                </div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap",
                  paddingTop:12,borderTop:"1px solid #F3F5F3"}}>
                  {[
                    {bg:"var(--pbg)",c:"var(--p)",  ic:Ico.calSm("var(--p)"),   t:fmt(a.date)},
                    {bg:"var(--pbg)",c:"var(--p)",  ic:Ico.timeSm("var(--p)"),  t:a.time},
                    {bg:"var(--pbg)",c:"var(--p)",  ic:Ico.durSm("var(--p)"),   t:a.dur},
                    {bg:"#FFF8E6",   c:"#C08000",   ic:Ico.moneySm(),           t:`${a.cost} ر.س`}
                  ].map((ch,j)=>(
                    <span key={j} style={{
                      display:"inline-flex",alignItems:"center",gap:4,
                      padding:"5px 11px",borderRadius:16,
                      fontSize:10.5,fontWeight:700,
                      background:ch.bg,color:ch.c
                    }}>{ch.ic}{ch.t}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── PROFILE PAGE ── */

    <div className="page">

        background:"#23302C",
        padding:"26px 18px 18px",color:"white",

      }}>

            width:52,height:52,borderRadius:12,
            background:"rgba(255,255,255,.18)",

            boxShadow:"0 8px 28px rgba(0,0,0,.20)"
          }}>
            {Ico.user("white")}
          </div>
          <div>
            <h1 style={{fontSize:22,fontWeight:700,marginBottom:10,letterSpacing:"-.2px"}}>{name}</h1>
            <div style={{
              display:"inline-flex",alignItems:"center",gap:7,
              background:"rgba(255,255,255,.14)",borderRadius:16,
              padding:"5px 14px",border:"1px solid rgba(255,255,255,.24)"
            }}>
              <div style={{width:7,height:7,borderRadius:"50%",background:"#C8B4F0",
                animation:"blink 1.8s infinite"}}/>
              <span style={{fontSize:12,fontWeight:700}}>عضو نشط</span>
            </div>
          </div>
        </div>
      </div>

      <div style={{padding:"20px 16px"}}>
        {/* Personal info */}
        <div style={{
          background:"white",borderRadius:16,padding:20,
          marginBottom:16,
          boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
          border:"1px solid var(--line)"
        }}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <div style={{width:42,height:42,borderRadius:16,
              background:"var(--sand)",
              border:"1.5px solid var(--pbg)",
              boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
              display:"flex",alignItems:"center",justifyContent:"center"}}>
              {Ico.user("var(--p)")}
            </div>
            <h3 style={{fontSize:14.5,fontWeight:600,color:"var(--txt)"}}>البيانات الشخصية</h3>
          </div>
          {[
            {lbl:"الاسم الكامل",val:name},
            {lbl:"رقم الجوال",val:phone},
            {lbl:"البريد الإلكتروني",val:"—"},
            {lbl:"المدينة",val:"—"}
          ].map((r,i,arr)=>(
            <div key={i} style={{
              display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"13px 0",
              borderBottom:i<arr.length-1?"1px solid #F3F5F3":"none"
            }}>
              <span style={{fontSize:12.5,color:"var(--txts)"}}>{r.lbl}</span>
              <span style={{
                fontSize:13.5,fontWeight:700,
                color:r.val==="—"?"#B0A0C8":"var(--txt)"
              }}>{r.val}</span>
            </div>
          ))}
          <button className="btn" style={{
            marginTop:16,padding:13,borderRadius:16,width:"100%",
            border:"2px solid var(--brd)",background:"transparent",
            color:"var(--p)",fontSize:13.5,fontWeight:700,
            display:"flex",alignItems:"center",justifyContent:"center",gap:8
          }}>
            {Ico.edit()} تعديل البيانات
          </button>
        </div>

        {/* Settings */}
        <div style={{
          background:"white",borderRadius:16,padding:20,
          marginBottom:16,
          boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
          border:"1px solid var(--line)"
        }}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <div style={{width:42,height:42,borderRadius:16,
              background:"var(--sand)",
              border:"1.5px solid var(--pbg)",
              boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",
              display:"flex",alignItems:"center",justifyContent:"center"}}>{Ico.gear("var(--p)")}</div>
            <h3 style={{fontSize:14.5,fontWeight:600,color:"var(--txt)"}}>الإعدادات</h3>
          </div>
          {[
            {icon:Ico.bell("var(--p)"),   lbl:"الإشعارات",     toggle:true},
            {icon:Ico.globe("var(--p)"),  lbl:"اللغة",         val:"العربية"},
            {icon:Ico.shield("var(--p)"), lbl:"الخصوصية"},
            {icon:Ico.share("var(--p)"),  lbl:"مشاركة التطبيق"}

                <div style={{width:40,height:40,borderRadius:16,
                  background:"var(--sand)",
                  border:"1.5px solid var(--pbg)",
                  boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)",

        {/* Join specialist */}

          </h3>
          <p style={{fontSize:12.5,color:"var(--txts)",marginBottom:18,lineHeight:1.85}}>
            انضم إلى فريقنا وساعد الأسر التي تحتاج دعمك
          </p>
          <div style={{
            display:"inline-flex",alignItems:"center",gap:9,
            background:"#1FA855",
            color:"white",padding:"12px 26px",borderRadius:16,
            fontSize:13.5,fontWeight:600,
            boxShadow:"0 1px 2px rgba(35,48,44,.03), 0 8px 22px rgba(35,48,44,.045)"
          }}>
            {Ico.wa()} انقر هنا للانضمام

        </div>

        <button className="btn" style={{
          width:"100%",padding:15,borderRadius:16,
          border:"2px solid #FFD5D5",background:"#FFF5F5",
          color:"#D35454",fontSize:13.5,fontWeight:700,
          fontFamily:"'IBM Plex Sans Arabic',sans-serif",
          display:"flex",alignItems:"center",justifyContent:"center",gap:9
        }}>
          {Ico.logout()} تسجيل الخروج
        </button>
      </div>
    </div>
  );
}

/* ── BOTTOM NAV ── */

function BottomNav({ page, nav }) {
  const items = [
    {k:"profile",      lbl:"الشخصية",  on:page==="profile",      ico:(c)=>Ico.user(c)},
    {k:"appointments", lbl:"مواعيدي",  on:page==="appointments", ico:(c)=>Ico.cal(c,false)},
    {k:"home",         lbl:"الرئيسية", on:!["appointments","profile"].includes(page), ico:(c)=>Ico.home(c,false)}
  ];
  return (
    <div className="bnav">
      {items.map(it=>(
        <div key={it.k} className="ni" onClick={()=>nav(it.k)}>
          <div style={{
            position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",
            width:26,height:3,borderRadius:"0 0 3px 3px",
            background:it.on?"var(--acc)":"transparent"
          }}/>
          {it.ico(it.on?"var(--ink)":"var(--mut2)")}
          <span style={{
            fontSize:11,fontWeight:it.on?600:400,
            color:it.on?"var(--ink)":"var(--mut2)"
          }}>{it.lbl}</span>
        </div>
      ))}
    </div>
  );
}

/* ── ROOT APP ── */

function App() {
  const [page,    setPage]    = useState("home");
  const [svc,     setSvc]     = useState(null);
  const [prov,    setProv]    = useState(null);
  const [bk,      setBk]      = useState(null);
  const [userInfo,setUserInfo] = useState(null);

  const nav = p => { setPage(p); window.scrollTo({top:0, behavior:"instant"}); };

  // مفتاح فريد لكل صفحة لضمان إعادة تشغيل الـ animation
  const pageKey = page;

  return (
    <div key={pageKey}>
      {page==="home" && (
        <HomePage onSvc={s=>{setSvc(s);nav("providers");}}/>
      )}
      {page==="providers" && svc && (
        <ProvidersPage svc={svc}
          onProv={p=>{setProv(p);nav("detail");}}
          onBack={()=>nav("home")}/>
      )}
      {page==="detail" && prov && (
        <ProviderDetail p={prov} svc={svc}
          onBook={()=>nav("userinfo")}
          onBack={()=>nav("providers")}/>
      )}
      {page==="userinfo" && prov && (
        <UserInfoPage prov={prov} svc={svc}
          onNext={info=>{ saveClient(info.name, info.phone); setUserInfo(info); nav("booking"); }}
          onBack={()=>nav("detail")}/>
      )}
      {page==="booking" && prov && (
        <BookingPage p={prov} svc={svc}
          onConfirm={(d,t,dur,cost)=>{
            setBk({p:prov,svc,day:d,time:t,dur,cost,userInfo});
            nav("confirm");
          }}
          onBack={()=>nav("userinfo")}/>
      )}
      {page==="confirm" && bk && (
        <ConfirmPage bk={bk}
          onConfirm={()=>nav("appointments")}
          onBack={()=>nav("booking")}/>
      )}
      {page==="appointments" && <ApptsPage userInfo={userInfo}/>}
      {page==="profile"      && <ProfilePage userInfo={userInfo}/>}

      <BottomNav page={page} nav={nav}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
